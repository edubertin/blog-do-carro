name: Bug
description: Relate um comportamento incorreto do Blog do Carro.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: route
    attributes:
      label: Rota ou fluxo
      placeholder: /loja/chaveiro-presente
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e observado
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Dispositivo e viewport
      placeholder: Android, Chrome, 390 × 844
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sanitizadas
      description: Não inclua credenciais, dados pessoais ou payloads sensíveis.
